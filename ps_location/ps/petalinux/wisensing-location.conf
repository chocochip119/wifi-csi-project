# Boot-time settings for the integrated FPGA Pose + PS Ridge Location app.
# auto: read encoder.input scale directly from weights_5rx.bin (blob v2 header).
# A numeric override is still supported; the app warns if it differs from the blob.
WISE_INPUT_SCALE=auto
WISE_TTY=/dev/ttyACM0
# FAT32 BOOT partition is mounted read-only during board startup.
WISE_SD_MOUNT=/mnt/wise-boot
WISE_WEIGHTS=/mnt/wise-boot/weights_5rx.bin
WISE_MAX_WINDOWS=0
WISE_LOC_MODEL=/usr/share/pose-cnn-rx5/loc_ridge_rx5.bin
WISE_LOC_STRIDE_S=0.5
WISE_TCP_PORT=5000
WISE_FORWARD_CSI=0
# WISE_TCP_BIND=0.0.0.0
