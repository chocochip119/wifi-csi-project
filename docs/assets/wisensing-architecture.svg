<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="WiSensing: Wi-Fi TX/RX에서 Zynq PS로 CSI를 수집하고, PS C Ridge 위치 추론과 FPGA CNN 자세 추론을 실행한 뒤 TCP 5000으로 PC Backend 및 Frontend에 전송">
