<text x="1318.0" y="651" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">[32, 8, 4]</text>
<polyline points="1318,693 1318,732" fill="none" stroke="#208F83" stroke-width="2.4" stroke-linejoin="round"/>
