<text x="960.0" y="1117" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">128 INT8 activations</text>
<polyline points="1114,1087 1154,1087" fill="none" stroke="#61788F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="1164" y="1015" width="308" height="145" rx="14" fill="#FFF5E3" stroke="#C58A28" stroke-width="1.5"/>
<text x="1318.0" y="1053" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#C58A28" text-anchor="middle">FC3</text>
<text x="1318.0" y="1088" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">128 → 24</text>
<text x="1318.0" y="1117" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">Requant · no GELU</text>
<polyline points="1472,1087 1512,1087" fill="none" stroke="#61788F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="1522" y="1015" width="308" height="145" rx="14" fill="#EAF3FC" stroke="#337DC1" stroke-width="1.5"/>
<text x="1676.0" y="1053" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#337DC1" text-anchor="middle">Pose output</text>
<text x="1676.0" y="1088" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">24 INT8 values</text>
<text x="1676.0" y="1117" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">12 joints × (x, y)</text>
<rect x="65" y="1200" width="1790" height="69" rx="10" fill="#F5F8FB" stroke="#C7D5E2" stroke-width="1.5"/>
<text x="90" y="1243" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#61788F" text-anchor="start">FC1 / FC2 include Requant before GELU. Dropout is omitted during inference. Coordinates = INT8 × output_scale.</text>
