<polyline points="960,732 960,768" fill="none" stroke="#208F83" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="710" y="768" width="500" height="100" rx="14" fill="#E9F6F2" stroke="#208F83" stroke-width="1.5"/>
<text x="960.0" y="806" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#208F83" text-anchor="middle">Concat along channels</text>
<text x="960.0" y="841" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">[160, 8, 4] = 5,120 features</text>
<text x="1250" y="811" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#208F83" text-anchor="start">5 RX × 1,024</text>
<text x="1250" y="845" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#61788F" text-anchor="start">weights shared; features kept per RX</text>
<polyline points="960,868 960,903 40,903 40,1087 80,1087" fill="none" stroke="#208F83" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="65" y="961" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#337DC1" text-anchor="start">03</text>
<text x="115" y="961" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#17324D" text-anchor="start">FC head · coordinate regression</text>
<rect x="90" y="1015" width="308" height="145" rx="14" fill="#E9F6F2" stroke="#208F83" stroke-width="1.5"/>
<text x="244.0" y="1053" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#208F83" text-anchor="middle">Flatten</text>
<text x="244.0" y="1088" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">5,120 features</text>
<text x="244.0" y="1117" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">C → S → T within each RX</text>
<polyline points="398,1087 438,1087" fill="none" stroke="#61788F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="448" y="1015" width="308" height="145" rx="14" fill="#FFF5E3" stroke="#C58A28" stroke-width="1.5"/>
<text x="602.0" y="1053" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#C58A28" text-anchor="middle">FC1 + GELU</text>
<text x="602.0" y="1088" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">5120 → 128</text>
<text x="602.0" y="1117" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">128 INT8 activations</text>
<polyline points="756,1087 796,1087" fill="none" stroke="#61788F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
