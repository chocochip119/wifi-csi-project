<rect width="1920" height="1330" fill="white"/>
<text x="65" y="68" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" fill="#17324D" text-anchor="start">WiSensing | RX5 Pose CNN</text>
<text x="65" y="108" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#61788F" text-anchor="start">Input [15, 128, 10] · INT8 inference · shared encoder weights · 12-joint coordinate regression</text>
<text x="1855" y="65" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="600" fill="#61788F" text-anchor="end">RX5 / tensor order [C, S, T]</text>
