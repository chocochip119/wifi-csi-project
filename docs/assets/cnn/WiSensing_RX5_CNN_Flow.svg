<text x="65" y="195" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#337DC1" text-anchor="start">01</text>
<text x="115" y="195" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#17324D" text-anchor="start">Shared receiver encoder</text>
<text x="115" y="227" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#61788F" text-anchor="start">One RX uses base / delta / mask; the same trained weights are applied to RX0–RX4.</text>
<rect x="90" y="263" width="360" height="145" rx="14" fill="#EAF3FC" stroke="#337DC1" stroke-width="1.5"/>
<text x="270.0" y="301" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#337DC1" text-anchor="middle">RX input</text>
<text x="270.0" y="336" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">[3, 128, 10]</text>
<text x="270.0" y="365" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">base / delta / mask</text>
<polyline points="450,335 538,335" fill="none" stroke="#61788F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="550" y="263" width="360" height="145" rx="14" fill="#EAF3FC" stroke="#337DC1" stroke-width="1.5"/>
<text x="730.0" y="301" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#337DC1" text-anchor="middle">Conv1 + RQ + GELU</text>
<text x="730.0" y="336" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">3 → 16 · kernel 5×3</text>
<text x="730.0" y="365" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">[16, 128, 10]</text>
<polyline points="910,335 998,335" fill="none" stroke="#61788F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="1010" y="263" width="360" height="145" rx="14" fill="#F1ECF8" stroke="#815CB2" stroke-width="1.5"/>
<text x="1190.0" y="301" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#815CB2" text-anchor="middle">Conv2 + RQ + GELU</text>
<text x="1190.0" y="336" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">16 → 32 · kernel 3×3</text>
<text x="1190.0" y="365" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">[32, 128, 10]</text>
<polyline points="1370,335 1458,335" fill="none" stroke="#61788F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="1470" y="263" width="360" height="145" rx="14" fill="#E9F6F2" stroke="#208F83" stroke-width="1.5"/>
<text x="1650.0" y="301" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#208F83" text-anchor="middle">Adaptive AvgPool</text>
<text x="1650.0" y="336" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">output size 8×4</text>
<text x="1650.0" y="365" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#17324D" text-anchor="middle">[32, 8, 4]</text>
<text x="90" y="443" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#61788F" text-anchor="start">RQ = Requantization. BatchNorm is folded into Conv weights/bias for FPGA inference.</text>
<text x="65" y="513" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#337DC1" text-anchor="start">02</text>
<text x="115" y="513" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#17324D" text-anchor="start">Receiver feature aggregation</text>
<text x="115" y="545" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#61788F" text-anchor="start">Each receiver contributes 32×8×4 = 1,024 INT8 features.</text>
